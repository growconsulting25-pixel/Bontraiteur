# Netlify : construction Next.js avec l'adaptateur officiel.
# Le plugin génère les fonctions serveur (connexion, portail, back-office,
# formulaires, webhook Stripe) et la fonction du proxy (protection des pages).
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"
